; X4 Triple Screen
; Use "auto" to cover the complete Windows virtual desktop.

[window]
x=auto
y=auto
width=auto
height=auto
borderless=1
lock_size=1
virtualize_monitor=1
topmost=0

[launcher]
x4_exe=auto
steam_exe=auto
prepare_x4_config=1
lock_x4_config=0
steam_wait_seconds=20

[advanced]
watchdog_ms=500
